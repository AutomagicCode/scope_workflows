name: 通过excel自动导入BUG缺陷工单

# 手动触发：读取当前仓库根目录的 Excel，为每条缺陷创建工单
# Excel 约定：第 1 行大标题，第 2 行表头
# 表头列支持：标题、问题描述、复现步骤、期望结果、实际结果、
#              运行环境、关联测试用例、外部编号、备注（缺失按空处理）

on:
  workflow_dispatch:
    inputs:
      excel_file:
        description: 'Excel 文件名（仓库内相对路径）'
        required: true
        default: 'bugs.xlsx'
      dry_run:
        description: '仅预览不创建（true/false）'
        required: true
        default: 'true'

jobs:
  import:
    name: 批量创建缺陷工单
    runs-on: windows
    steps:
      - name: 下载源码
        uses: actions/checkout@v4

      - name: 导入缺陷工单
        uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/import-bugs@main
        with:
          TOKEN: ${{ secrets.BOT_TOKEN }}
          target-repo: ${{ github.repository }}
          excel-file: ${{ github.event.inputs.excel_file }}
          dry-run: ${{ github.event.inputs.dry_run }}
