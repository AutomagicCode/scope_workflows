name: AI 审核与工单处理

on:
  pull_request:
    types: [opened, synchronize]
  pull_request_review:
    types: [submitted, edited]
  issues:
    types: [opened, edited, assigned]
  issue_comment:
    types: [created]

jobs:
  ai_process:
    name: AI 审核与工单处理
    runs-on: windows
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/ai-review@main
        with:
          gitea-token: ${{ secrets.BOT_TOKEN }}
          api-key: ${{ secrets.AI_API_KEY }}
          # 默认使用智谱清言；切换其它 OpenAI 兼容服务时改下面两项即可
          # api-base: https://api.deepseek.com/chat/completions
          # model: deepseek-chat
