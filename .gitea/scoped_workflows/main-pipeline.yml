name: 主工作流（先打标签，后执行其它任务）

# 说明：所有事件统一走这个 workflow，确保「工单自动管理（打标签）」最先执行；
# 其它 job 通过 needs 等待 auto_assign 完成后才跑。
# auto_assign 脚本对非 pull_request/issues 事件会 no-op 退出（exit 0），
# 因此不会阻塞 push/release/评论/审核等事件。

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, closed, synchronize]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issues:
    # 不监听 labeled/unlabeled：打标签由本工作流自己完成，避免 bot 用 PAT 打标签反向触发形成循环
    types: [opened, edited, assigned, closed, reopened]
  issue_comment:
    types: [created]
  release:
    types: [published, created]
  workflow_dispatch:
    inputs:
      os:
        description: '构建平台'
        type: choice
        options:
          - windows
          - ubuntu-latest
        default: windows
      release_target:
        description: '要发版的 commit hash(留空则只 build/test, 不发版)'
        required: false
        default: ''
        type: string

jobs:
  auto_assign:
    name: 工单自动管理
    runs-on: windows
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/auto-assign@main
        with:
          gitea-token: ${{ secrets.BOT_TOKEN }}
          testers: ${{ vars.TESTERS }}
          label-pending: '状态/待处理'
          label-processing: '状态/处理中'
          label-testing: '状态/已处理'
          label-test-pass: '测试/通过'
          label-test-fail: '测试/不通过'
          label-none: ''

  request_reviewers:
    name: 自动指定代码评审人
    needs: [auto_assign]
    runs-on: windows
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')
    steps:
      - name: 读取分支保护并自动指定评审人
        shell: powershell
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          $parts = $env:REPO_FULL -split '/'
          $owner = $parts[0]
          $repo = $parts[1]
          $apiBase = "http://192.168.1.188:3000/api/v1/repos/$owner/$repo"
          $branch = $env:BASE_REF
          $encodedBranch = [System.Uri]::EscapeDataString($branch)
          $ruleUrl = "$apiBase/branch_protections/$encodedBranch"
          $headers = @{ Authorization = "token $env:BOT_TOKEN" }
          try {
            $rule = Invoke-RestMethod -Uri $ruleUrl -Headers $headers -Method GET
          } catch {
            Write-Host "cannot read branch protection for ${branch}: $_"
            exit 0
          }
          $reviewers = @()
          $teamReviewers = @()
          if ($rule.enable_approvals_whitelist -eq $true) {
            if ($rule.approvals_whitelist_username -and $rule.approvals_whitelist_username.Count -gt 0) {
              $reviewers = $rule.approvals_whitelist_username
            }
            if ($rule.approvals_whitelist_teams -and $rule.approvals_whitelist_teams.Count -gt 0) {
              $teamReviewers = $rule.approvals_whitelist_teams
            }
          }
          if ($reviewers.Count -eq 0 -and $teamReviewers.Count -eq 0) {
            Write-Host "branch protection has no approval whitelist, skip"
            exit 0
          }
          $body = @{}
          if ($reviewers.Count -gt 0) { $body.reviewers = $reviewers }
          if ($teamReviewers.Count -gt 0) { $body.team_reviewers = $teamReviewers }
          $json = $body | ConvertTo-Json
          $postUrl = "$apiBase/pulls/$env:PR_NUMBER/requested_reviewers"
          try {
            Invoke-RestMethod -Uri $postUrl -Headers $headers -Method POST -Body $json -ContentType 'application/json'
            Write-Host "requested reviewers: $json"
          } catch {
            Write-Host "request reviewers failed: $_"
            exit 0
          }

  build:
    name: 构建并测试/发布
    needs: [auto_assign]
    runs-on: ${{ github.event.inputs.os || vars.DEFAULT_RUNNER || 'windows' }}
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main' &&
       (github.event.action == 'opened' || github.event.action == 'synchronize' || github.event.action == 'reopened'))
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/build-template@main
        with:
          release-target: ${{ github.event.inputs.release_target }}
          release-token: ${{ secrets.BOT_TOKEN }}

  ai_process:
    name: AI 审核与工单处理
    needs: [auto_assign]
    runs-on: windows
    if: >
      (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'synchronize')) ||
      (github.event_name == 'pull_request_review' && (github.event.action == 'submitted' || github.event.action == 'edited')) ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'assigned')) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created')
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/ai-review@main
        with:
          gitea-token: ${{ secrets.BOT_TOKEN }}
          bot-token: ${{ secrets.BOT_TOKEN }}
          api-key: ${{ secrets.AI_API_KEY }}
          # AI 服务地址、模型、上下文长度放仓库变量里，切换 AI 时不需改代码
          api-base: ${{ vars.AI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4/chat/completions' }}
          model: ${{ vars.AI_MODEL || 'glm-4-flash' }}
          max-diff-chars: ${{ vars.AI_MAX_DIFF_CHARS || '24000' }}
          # 为 true 时启用 gemini-cli agent 模式分析整个 PR 目录（仅对 pull_request 生效）
          use-gemini-cli: ${{ vars.AI_USE_GEMINI_CLI || 'false' }}

  notify:
    name: 企业微信通知
    needs: [auto_assign]
    runs-on: windows
    if: >
      (github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened')) ||
      (github.event_name == 'pull_request_review' && (github.event.action == 'submitted' || github.event.action == 'dismissed')) ||
      (github.event_name == 'issues' && (github.event.action == 'opened' || github.event.action == 'closed' || github.event.action == 'reopened')) ||
      (github.event_name == 'issue_comment' && github.event.action == 'created') ||
      (github.event_name == 'release' && (github.event.action == 'published' || github.event.action == 'created'))
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/wechat-notify@main
        with:
          webhook-url: ${{ secrets.WECHAT_WEBHOOK }}
          token: ${{ secrets.BOT_TOKEN }}
          msgtype: text
          user-map: ${{ vars.WECHAT_USERMAP }}
