name: 企业微信通知

on:
  release:
    types: [published, created]
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: windows
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/wechat-notify@main
        with:
          webhook-url: ${{ secrets.WECHAT_WEBHOOK }}
          token: ${{ secrets.BOT_TOKEN }}

          # issue_comment 场景（评论里 @ 人）需 text 消息才能@；其它场景保持 markdown 更美观
          msgtype: ${{ github.event_name == 'issue_comment' && 'text' || 'markdown' }}

          # Gitea @login 到企业微信 userID 的映射，例如 zhang3:ZhangSan,li4:LiSi（支持 : 或 = 分隔）
          user-map: ${{ vars.WECHAT_USERMAP }}