name: 企业微信通知

on:
  release:
    types: [published, created]
  pull_request:
    types: [opened, reopened]
  pull_request_review:
    types: [submitted, dismissed]
  issues:
    types: [opened, closed, reopened]
  issue_comment:
    types: [created]

jobs:
  notify:
    runs-on: windows
    steps:
      - uses: http://192.168.1.188:3000/wt-rd/CI-templates/.github/actions/wechat-notify@main
        with:
          webhook-url: ${{ secrets.WECHAT_WEBHOOK }}
          token: ${{ secrets.BOT_TOKEN }}

          # text 模式下裸 URL 可走系统浏览器，同时支持 @ 人
          msgtype: text

          # Gitea @login 到企业微信 userID 的映射，例如 zhang3:ZhangSan,li4:LiSi（支持 : 或 = 分隔）
          user-map: ${{ vars.WECHAT_USERMAP }}