name: 测试评论命令

# 在工单评论区输入命令，由 bot 账号代为切换标签（无需工单写权限）：
#   /测试通过   → 打「测试/通过」标签（auto-assign 随后自动关闭工单）
#   /测试不通过 → 打「测试/不通过」标签（auto-assign 随后进度退回 状态/待处理 并恢复打开工单）
#   /已处理 或 /已解决 → 打「状态/已处理」标签（同时清空 测试/ 组）
# 两个维度：进度组「状态/」与测试组「测试/」，组内互斥、组间可并存。
#   测试命令只动 测试/ 组；/已处理 置进度为 状态/已处理 并清 测试/ 组。
# 权限：测试命令仅当 vars.TESTERS 配置且非空时才限名单内；为空则任何人可用。
#       /已处理、/已解决 任何人均可用。
# 前置条件：/测试通过、/测试不通过 仅当工单已具备「状态/已处理」标签时才生效；
#       否则不改标签，bot 回复提示（仍有未合并 PR → 还没处理完；否则 → 需合并 PR 或评论 /已处理）。
# 说明：所有中文均通过 env 传入，API 响应强制 UTF-8 解码，脚本体不含中文字面量，
#       以兼容 Gitea act_runner 在 Windows PowerShell 5.1（GB2312 控制台）下的编码限制。

on:
  issue_comment:
    types: [created]

jobs:
  handle:
    name: 处理测试命令
    runs-on: windows
    # 仅处理工单（非 PR）评论，且评论以 / 开头
    if: ${{ !github.event.issue.pull_request && startsWith(github.event.comment.body, '/') }}
    steps:
      - name: 解析测试命令并更新标签
        shell: powershell
        env:
          SERVER: http://192.168.1.188:3000
          TOKEN: ${{ secrets.BOT_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          AUTHOR: ${{ github.event.comment.user.login }}
          TESTERS: ${{ vars.TESTERS }}
          # 中文全部走 env，避免脚本体中文字面量被 GB2312 误读
          CMD_PASS: '/测试通过'
          CMD_FAIL: '/测试不通过'
          CMD_DONE1: '/已处理'
          CMD_DONE2: '/已解决'
          LABEL_PASS: '测试/通过'
          LABEL_FAIL: '测试/不通过'
          LABEL_DONE: '状态/已处理'
          LABEL_DEV_PROCESSING: '状态/处理中'
          LABEL_PENDING: '状态/待处理'
          # 测试命令缺少「状态/已处理」时 bot 的回复文案（走 env 避免 GB2312 乱码）
          MSG_NEED_DONE: '(这个工单缺少「状态/已处理」标签，/测试* 命令暂不生效。)'
          MSG_PR_OPEN: '(＞﹏＜) 这个问题还没处理完呢～请等关联的 PR 合并后再测试吧。'
          MSG_NEED_MERGE: '(๑•̀ㅂ•́)و 至少需要有人用 PR 合并，或回复评论 /已处理 来触发工单添加「状态/已处理」标签。'
          # 测试命令已执行，但本工单仍有未合并 PR 时的提醒（仅提醒，不拦截）
          MSG_TEST_OPEN_PR: '(・_・;) 提醒：本工单仍有未合并的 PR，代码可能尚未全部进入主线，测试结论请以此为准确认。'
        run: |
          # NOTE: keep the script body ASCII-only (comments included). Chinese only via env.
          # PS 5.1 on the Windows runner reads this file as GB2312; non-ASCII in the body
          # can corrupt tokens (backtick/brace) and break parsing.
          $ErrorActionPreference = 'Stop'
          try { [Console]::OutputEncoding = [Text.Encoding]::UTF8; chcp 65001 | Out-Null } catch {}

          function Add-Label($name) {
              if (-not $name) { return }
              $id = $null
              $owner = $repo.Split('/')[0]
              foreach ($lp in @("/repos/$repo/labels", "/orgs/$owner/labels")) {
                  if ($id) { break }
                  $page = 1
                  while ($true) {
                      $lurl = "$server/api/v1$lp" + "?limit=50" + "&page=$page"
                      try {
                          $lr = Invoke-WebRequest -Method Get -Uri $lurl -Headers $auth -UseBasicParsing
                      } catch { break }
                      $larr = [Text.Encoding]::UTF8.GetString($lr.RawContentStream.ToArray()) | ConvertFrom-Json
                      if (-not $larr) { break }
                      $cnt = @($larr).Count
                      if ($cnt -eq 0) { break }
                      foreach ($l in $larr) { if ([string]$l.name -eq $name) { $id = $l.id; break } }
                      if ($id -or ($cnt -lt 50)) { break }
                      $page++
                  }
              }
              if ($id) {
                  $abody = @{ labels = @($id) } | ConvertTo-Json
                  $abytes = [Text.Encoding]::UTF8.GetBytes($abody)
                  try {
                      Invoke-RestMethod -Method Post -Uri "$server/api/v1/repos/$repo/issues/$issue/labels" -Headers $auth -Body $abytes -ContentType 'application/json; charset=utf-8' | Out-Null
                      Write-Host "issue #$issue added label -> $name"
                  } catch { Write-Host "add label $name failed: $_" }
              } else {
                  Write-Host "WARN: label not found in repo/org labels, skip add: $name"
              }
          }

          $server = $env:SERVER.TrimEnd('/')
          $token  = $env:TOKEN
          $repo   = $env:REPO
          $issue  = $env:ISSUE
          $body   = $env:BODY.Trim()
          $author = $env:AUTHOR
          $pass   = $env:LABEL_PASS
          $fail   = $env:LABEL_FAIL

          if (-not $token) { Write-Error 'missing BOT_TOKEN'; exit 1 }

          $done    = $env:LABEL_DONE
          $devProc = $env:LABEL_DEV_PROCESSING
          $pending = $env:LABEL_PENDING

          # Match command (keywords come from env, no Chinese literals).
          # Two dimensions: test group (pass/fail) and progress group (pending/processing/done).
          # Test commands touch only the test group; /done sets progress to "done" and also
          # clears the whole test group (a re-handled issue waits for a fresh test result).
          # $requireTester: whether the command is limited to the TESTERS list.
          # $requireDone: test commands (pass/fail) require the "done" label first.
          $testGroup   = @($pass, $fail)
          $statusGroup = @($pending, $devProc, $done)
          $target = $null
          $removeSet = @()
          $extra = $null
          $targetState = $null
          $requireTester = $false
          $requireDone = $false
          if ($body.StartsWith($env:CMD_PASS)) {
              $target = $pass; $removeSet = $testGroup; $targetState = 'closed'; $requireTester = $true; $requireDone = $true
          } elseif ($body.StartsWith($env:CMD_FAIL)) {
              $target = $fail; $removeSet = @($testGroup + $statusGroup); $extra = $pending; $targetState = 'open'; $requireTester = $true; $requireDone = $true
          } elseif ($body.StartsWith($env:CMD_DONE1) -or $body.StartsWith($env:CMD_DONE2)) {
              $target = $done; $removeSet = @($statusGroup + $testGroup); $targetState = 'open'; $requireTester = $false
          } else {
              Write-Host 'not a command, skip.'
              exit 0
          }

          # Permission: only test commands, and only when TESTERS is non-empty, are limited to the list.
          $testers = @()
          if ($env:TESTERS) {
              $testers = $env:TESTERS.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          }
          if ($requireTester -and $testers.Count -gt 0 -and ($testers -notcontains $author)) {
              Write-Host "comment author '$author' not in TESTERS, skip."
              exit 0
          }

          $auth = @{ Authorization = "token $token" }

          # UTF-8 safe GET: PS5.1 Invoke-RestMethod decodes charset-less responses as Latin1.
          $resp = Invoke-WebRequest -Method Get -Uri "$server/api/v1/repos/$repo/issues/$issue" `
              -Headers $auth -UseBasicParsing
          $issueObj = [Text.Encoding]::UTF8.GetString($resp.RawContentStream.ToArray()) | ConvertFrom-Json

          $names = @()
          if ($issueObj.labels) { $names = @($issueObj.labels | ForEach-Object { [string]$_.name }) }

          # For test commands, find whether an open (unmerged) PR still references this issue.
          # Computed up front so both the gate (missing done) and the warn-only path can use it.
          $hasOpenPR = $false
          $openPrNums = @()
          if ($requireDone) {
              $pullsUri = "$server/api/v1/repos/$repo/pulls?state=open" + "&limit=50"
              try {
                  $prResp = Invoke-WebRequest -Method Get -Uri $pullsUri -Headers $auth -UseBasicParsing
                  $prs = [Text.Encoding]::UTF8.GetString($prResp.RawContentStream.ToArray()) | ConvertFrom-Json
                  $refPattern = '(^|[^0-9])#' + $issue + '([^0-9]|$)'
                  foreach ($pr in $prs) {
                      $b = [string]$pr.body
                      if ($b -match $refPattern) { $hasOpenPR = $true; $openPrNums += $pr.number }
                  }
              } catch { Write-Host "check open PR failed: $_" }
          }

          # Precondition for test commands: issue must already have the "done" label.
          if ($requireDone -and ($names -notcontains $done)) {
              $msg = $env:MSG_NEED_DONE
              if ($hasOpenPR) { $msg = $msg + "`n" + $env:MSG_PR_OPEN }
              else { $msg = $msg + "`n" + $env:MSG_NEED_MERGE }

              $cjson  = @{ body = $msg } | ConvertTo-Json -Depth 5
              $cbytes = [Text.Encoding]::UTF8.GetBytes($cjson)
              Invoke-RestMethod -Method Post -Uri "$server/api/v1/repos/$repo/issues/$issue/comments" `
                  -Headers $auth -Body $cbytes -ContentType 'application/json; charset=utf-8' | Out-Null
              Write-Host "issue #$issue missing done label, test command rejected (hasOpenPR=$hasOpenPR)."
              exit 0
          }

          # Apply changes by label ID (add target / delete mutually-exclusive) instead of
          # replacing the whole label set. A full PUT by name drops org-level labels whose
          # names cannot be resolved at repo scope (e.g. shared labels), so it must be avoided.

          # Delete mutually-exclusive labels currently on the issue, by their existing id.
          if ($issueObj.labels) {
              foreach ($lb in $issueObj.labels) {
                  $ln = [string]$lb.name
                  if (($removeSet -contains $ln) -and ($ln -ne $target)) {
                      try {
                          Invoke-RestMethod -Method Delete `
                              -Uri "$server/api/v1/repos/$repo/issues/$issue/labels/$($lb.id)" `
                              -Headers $auth | Out-Null
                          Write-Host "removed label '$ln' (id $($lb.id))"
                      } catch { Write-Host "remove label '$ln' skipped: $_" }
                  }
              }
          }

          # Refresh names after removals; keep the target label if it was already present.
          $names = @($issueObj.labels | ForEach-Object { [string]$_.name } | Where-Object { ($_ -eq $target) -or ($removeSet -notcontains $_) })

          # Add the target label and any extra label (e.g., pending for test-fail).
          if ($names -contains $target) {
              Write-Host "issue #$issue already has target label, nothing to add."
          } else {
              Add-Label $target
          }

          if ($extra -and ($names -notcontains $extra)) {
              Add-Label $extra
          }

          # Set issue state: closed for /测试通过, open for /测试不通过 and /已处理 /已解决.
          if ($targetState) {
              $sjson = @{ state = $targetState } | ConvertTo-Json
              $sbytes = [Text.Encoding]::UTF8.GetBytes($sjson)
              try {
                  Invoke-RestMethod -Method Patch -Uri "$server/api/v1/repos/$repo/issues/$issue" -Headers $auth -Body $sbytes -ContentType 'application/json; charset=utf-8' | Out-Null
                  Write-Host "issue #$issue state set to $targetState"
              } catch { Write-Host "set issue state failed: $_" }
          }

          # Warn-only: a test command ran while an open PR still references this issue.
          # We do not block the command; just leave a heads-up comment.
          if ($requireDone -and $hasOpenPR) {
              $wmsg = $env:MSG_TEST_OPEN_PR
              if ($openPrNums.Count -gt 0) { $wmsg = $wmsg + " (PR #" + ($openPrNums -join ', #') + ")" }
              $wjson  = @{ body = $wmsg } | ConvertTo-Json -Depth 5
              $wbytes = [Text.Encoding]::UTF8.GetBytes($wjson)
              Invoke-RestMethod -Method Post -Uri "$server/api/v1/repos/$repo/issues/$issue/comments" `
                  -Headers $auth -Body $wbytes -ContentType 'application/json; charset=utf-8' | Out-Null
              Write-Host "warned: open PR still references issue #$issue (PR $($openPrNums -join ','))."
          }
